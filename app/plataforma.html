<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fractal · Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0b; --panel:#15130f; --panel-2:#1b1813; --line:#2a2620;
    --gold:#b8935a; --gold-l:#d4b07a; --cream:#f5f0e8; --stone:#7a7468;
    --ok:#5a8a6a; --warn:#c9a24a; --err:#b56a5a; --info:#6a89a8;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .hidden{display:none!important}
  a{color:var(--gold-l);text-decoration:none;cursor:pointer}

  header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(13,13,11,.93);backdrop-filter:blur(8px);z-index:10}
  .bar{display:flex;align-items:center;justify-content:space-between;height:62px}
  .brand{font-family:var(--serif);font-size:21px;letter-spacing:.22em;color:var(--cream)}
  .brand b{color:var(--gold);font-weight:500}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--stone)}
  .rolebadge{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l);border:1px solid var(--gold);border-radius:20px;padding:3px 11px}

  .btn{font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.03em;cursor:pointer;border:1px solid var(--line);
       background:transparent;color:var(--cream);padding:8px 14px;border-radius:2px;transition:border-color .2s,color .2s}
  .btn:hover{border-color:var(--gold);color:var(--gold-l)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1509;font-weight:500}
  .btn.primary:hover{background:var(--gold-l);border-color:var(--gold-l)}
  .btn.ghost{border-color:transparent;color:var(--stone)}.btn.ghost:hover{color:var(--cream)}
  .btn.sm{font-size:12px;padding:5px 10px}
  .btn:disabled{opacity:.4;cursor:default}

  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px}
  .login .card{width:100%;max-width:400px;padding:40px 34px}
  .login .brand{display:block;text-align:center;margin-bottom:4px;font-size:26px}
  .login .sub{text-align:center;color:var(--stone);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px}
  label{display:block;font-size:12px;letter-spacing:.05em;color:var(--stone);margin:14px 0 6px}
  input,select{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--cream);font-family:var(--sans);font-size:14px;padding:11px 12px;border-radius:2px;outline:none}
  input:focus,select:focus{border-color:var(--gold)}
  .login .btn{width:100%;margin-top:22px;padding:12px}
  .msg{font-size:13px;padding:10px 12px;border-radius:2px;margin-top:14px;display:none}
  .msg.err{display:block;background:rgba(181,106,90,.12);border:1px solid var(--err);color:#e0b3aa}
  .demo{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;font-size:11.5px;color:var(--stone)}
  .demo b{color:var(--gold-l);font-weight:500}
  .demo .row{display:flex;justify-content:space-between;padding:3px 0;cursor:pointer}
  .demo .row:hover{color:var(--cream)}

  main{padding:30px 0 80px}
  h1{font-family:var(--serif);font-weight:500;font-size:30px;margin:0 0 2px}
  .lead{color:var(--stone);font-size:14px;margin:0 0 26px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
  .stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
  .stat .v{font-family:var(--serif);font-size:28px;font-weight:500;color:var(--cream);margin-top:6px;line-height:1}
  .stat .v small{font-size:14px;color:var(--stone)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
  .tile h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 6px}
  .rowl{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}
  .rowl .s{color:var(--stone)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:400;color:var(--stone);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;color:var(--stone)}
  .pill.ok{color:var(--ok);border-color:var(--ok)} .pill.gold{color:var(--gold-l);border-color:var(--gold)}
  .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.info{color:var(--info);border-color:var(--info)}
  .empty{color:var(--stone);font-size:13px;text-align:center;padding:20px}

  /* Calendario */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .calhead .mon{font-family:var(--serif);font-size:22px;color:var(--cream);min-width:180px;text-align:center}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .dow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);text-align:center;padding:4px 0}
  .day{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;padding:5px;font-size:12px;position:relative;background:var(--panel)}
  .day.mine{border-color:var(--gold);cursor:pointer}
  .day.mine:hover{background:var(--panel-2)}
  .day.other{opacity:.32}
  .day.res{background:rgba(90,138,106,.18);border-color:var(--ok)}
  .day.ced{background:rgba(201,162,74,.15);border-color:var(--warn)}
  .day .slot{position:absolute;bottom:4px;right:5px;font-size:9px;letter-spacing:.04em;color:var(--gold-l)}
  .day.sp::after{content:'★';position:absolute;top:4px;right:5px;font-size:9px;color:var(--gold)}
  .callegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--stone);margin-top:14px}
  .callegend i{width:11px;height:11px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle;border:1px solid var(--line)}

  .banner{background:rgba(201,162,74,.1);border:1px solid var(--warn);color:#e6cf95;padding:14px 18px;border-radius:4px;font-size:13px;margin:16px 0}
  code{font-family:ui-monospace,monospace;background:var(--panel-2);padding:1px 6px;border-radius:2px;color:var(--gold-l)}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)} .who .nm{display:none}}
</style>
</head>
<body>

<!-- CONFIG -->
<script>
  const SUPABASE_URL  = "https://pzlfzmpqwscimuxuoucq.supabase.co";
  const SUPABASE_ANON = "sb_publishable_gHqKk0y8w6AKKZj9h0joqQ_xC0XPRvD";
</script>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="card">
    <span class="brand">VIVE <b>FRACTAL</b></span>
    <div class="sub">Plataforma</div>
    <label for="email">Correo</label>
    <input id="email" type="email" placeholder="tu@correo.com" autocomplete="email">

    <div class="demo">
      <b>Cuentas demo</b> (clic para autocompletar) · un login por tipo de usuario:
      <div class="row" data-e="admin@vivefractal.com" data-p="ViveFractal#Admin1"><span>Administrador</span><span>admin@…</span></div>

      <div class="row" data-e="dueno@vivefractal.com" data-p="Fractal#Dueno1"><span>Dueño (Origen)</span><span>dueno@…</span></div>
      <div class="row" data-e="inversionista.demo@vivefractal.com" data-p="ViveFractal#Demo1"><span>Co-propietario</span><span>…demo@…</span></div>

<!-- APP -->
<div id="app" class="hidden">
  <header><div class="wrap bar">
    <span class="brand">VIVE <b>FRACTAL</b></span>
    <div class="who"><span class="nm" id="hiName"></span><span class="rolebadge" id="roleBadge"></span><button class="btn ghost" id="logout">Salir</button></div>
  </div></header>
  <main class="wrap" id="panel"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const COP = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const $ = id => document.getElementById(id);
const fecha = s => new Date(s+'T00:00:00').toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
const cap = s => (s||'').charAt(0).toUpperCase()+(s||'').slice(1).replace(/_/g,' ');
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ROL_LABEL={admin:'Administrador',operador:'Operador',asesor:'Asesor',dueno:'Dueño',co_propietario:'Co-propietario',huesped:'Huésped'};

const configured = SUPABASE_URL && SUPABASE_ANON;
let sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
let ME = null;

// Login autocompletar
document.querySelectorAll('.demo .row').forEach(r => r.onclick=()=>{ $('email').value=r.dataset.e; $('pass').value=r.dataset.p; });

$('authBtn').onclick = async () => {
  const email=$('email').value.trim(), pass=$('pass').value, b=$('authBtn'), m=$('loginMsg');
  if(!configured){ m.className='msg err'; m.textContent='Falta configurar Supabase.'; return; }
  if(!email||!pass){ m.className='msg err'; m.textContent='Escribe correo y contraseña.'; return; }
  b.disabled=true; b.textContent='...';
  try{ const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error; }
  catch(e){ m.className='msg err'; m.textContent=/Invalid login/i.test(e.message)?'Correo o contraseña incorrectos.':e.message; }
  finally{ b.disabled=false; b.textContent='Entrar'; }
};
$('logout').onclick = async ()=>{ if(sb) await sb.auth.signOut(); location.reload(); };

async function boot(){
  if(!configured) return;
  const { data:{session} } = await sb.auth.getSession();
  if(!session) return;
  const { data:perfil } = await sb.from('perfiles').select('*').eq('id',session.user.id).maybeSingle();
  ME = perfil || { id:session.user.id, nombre:session.user.email, rol:'co_propietario' };
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('hiName').textContent = ME.nombre || session.user.email;
  $('roleBadge').textContent = ROL_LABEL[ME.rol] || ME.rol;
  routePanel();
}
if(sb) sb.auth.onAuthStateChange((_e,s)=>{ if(s) boot(); });
boot();

// ————— Router por rol —————
function routePanel(){
  const r = ME.rol;
  if(r==='admin') return panelAdmin();
  if(r==='operador') return panelOperador();
  if(r==='asesor') return panelAsesor();
  if(r==='dueno') return panelDueno();
  if(r==='huesped') return panelHuesped();
  return panelCoPropietario();
}
const H = html => { $('panel').innerHTML = html; };
const stat = (k,v)=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const tbl = (head,rows)=>`<div class="card"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}" class="empty">Sin datos.</td></tr>`}</tbody></table></div>`;

// ————— CO-PROPIETARIO (el corazón: fracciones + puntos + calendario + ingresos) —————
async function panelCoPropietario(){
  H(`<h1>Mi copropiedad</h1><p class="lead">Tus fracciones, tus puntos, tu calendario y tus ingresos por días cedidos.</p><div id="c"></div>`);
  const uid = ME.id;
  const { data:fr } = await sb.from('fracciones').select('*,activo:activos(id,nombre,destino)').eq('co_propietario_id',uid);
  const { data:pts } = await sb.from('puntos_mov').select('puntos,anio').eq('co_propietario_id',uid);
  const { data:rentas } = await sb.from('rentas').select('*').eq('co_propietario_id',uid);
  const saldo = (pts||[]).filter(p=>p.anio===2026).reduce((a,p)=>a+Number(p.puntos),0);
  const ingreso = (rentas||[]).filter(r=>r.estado==='confirmada').reduce((a,r)=>a+Number(r.ingreso_copropietario),0);
  const costoMes = (fr||[]).reduce((a,f)=>a+Number(f.costo_mensual),0);

  let html = `<div class="stats">
    ${stat('Fracciones', (fr||[]).length)}
    ${stat('Puntos 2026', saldo.toFixed(0))}
    ${stat('Costo mensual', `<small>${COP(costoMes)}</small>`)}
    ${stat('Ingreso cedido', `<small>${COP(ingreso)}</small>`)}
  </div><div class="eyebrow">Mis fracciones</div><div class="grid">`;
  (fr||[]).forEach(f=>{ html += `<div class="tile"><h3>${f.slot} · ${f.activo?.nombre||''}</h3>
    <div class="rowl"><span class="s">Tipo</span><span>${cap(f.tipo)}</span></div>
    <div class="rowl"><span class="s">Participación</span><span>${(f.pct*100).toFixed(2)}%</span></div>
    <div class="rowl"><span class="s">Días/año</span><span>${f.dias_anio}</span></div>
    <div class="rowl"><span class="s">Costo mensual</span><span>${COP(f.costo_mensual)}</span></div></div>`; });
  html += `</div>`;
  if(!fr||!fr.length){ html += `<div class="banner">Aún no tienes fracciones asignadas.</div>`; }
  html += `<div class="eyebrow">Mi calendario 2026</div><div id="cal"></div>`;
  html += `<div class="eyebrow">Ingresos por días cedidos</div>`;
  html += tbl(['Fecha','Huésped','Renta','Comisión op.','Tu ingreso','Estado'],
    (rentas||[]).map(r=>`<tr><td>${fecha(r.fecha)}</td><td>${r.huesped_nombre||'—'}</td><td>${COP(r.monto)}</td><td>${COP(r.comision_operador)}</td><td>${COP(r.ingreso_copropietario)}</td><td><span class="pill ok">${cap(r.estado)}</span></td></tr>`).join(''));
  $('c').innerHTML = html;

  // Calendario: días asignados a mis slots
  if(fr && fr.length){
    const activoId = fr[0].activo?.id;
    const misSlots = fr.map(f=>f.slot);
    const { data:dias } = await sb.from('calendario_dias').select('*').eq('activo_id',activoId).order('fecha');
    const { data:reservas } = await sb.from('reservas').select('*').eq('co_propietario_id',uid);
    const resMap = Object.fromEntries((reservas||[]).map(r=>[r.fecha,r.estado]));
    renderCalendario($('cal'), dias||[], misSlots, resMap, uid, activoId);
  }
}

let calMonth = new Date().getMonth() < 11 ? new Date().getMonth() : 0;
function renderCalendario(cont, dias, misSlots, resMap, uid, activoId){
  const byDate = Object.fromEntries(dias.map(d=>[d.fecha,d]));
  function draw(){
    const y=2026, first=new Date(y,calMonth,1), startDow=first.getDay(), days=new Date(y,calMonth+1,0).getDate();
    let g = `<div class="calhead">
      <button class="btn sm" id="pm">‹</button>
      <div class="mon">${MESES[calMonth]} ${y}</div>
      <button class="btn sm" id="nm">›</button></div>
      <div class="cal">${['D','L','M','M','J','V','S'].map(d=>`<div class="dow">${d}</div>`).join('')}`;
    for(let i=0;i<startDow;i++) g += `<div></div>`;
    for(let d=1; d<=days; d++){
      const ds = `${y}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const cd = byDate[ds];
      if(!cd){ g += `<div class="day other">${d}</div>`; continue; }
      const mine = misSlots.includes(cd.slot);
      const st = resMap[ds];
      let cls = 'day' + (mine?' mine':' other') + (cd.es_especial?' sp':'') + (st==='reservado'?' res':'') + (st==='cedido'?' ced':'');
      g += `<div class="${cls}" ${mine?`data-f="${ds}"`:''}>${d}<span class="slot">${cd.slot}</span></div>`;
    }
    g += `</div><div class="callegend">
      <span><i style="border-color:var(--gold)"></i>Mis días</span>
      <span><i style="background:rgba(90,138,106,.4);border-color:var(--ok)"></i>Reservado</span>
      <span><i style="background:rgba(201,162,74,.4);border-color:var(--warn)"></i>Cedido</span>
      <span>★ fecha especial</span></div>`;
    cont.innerHTML = g;
    $('pm').onclick=()=>{ calMonth=(calMonth+11)%12; draw(); };
    $('nm').onclick=()=>{ calMonth=(calMonth+1)%12; draw(); };
    cont.querySelectorAll('.day.mine[data-f]').forEach(el=> el.onclick=()=>accionDia(el.dataset.f, resMap, uid, activoId, draw, byDate));
  }
  draw();
}

async function accionDia(fechaISO, resMap, uid, activoId, redraw, byDate){
  const cd = byDate[fechaISO];
  const estado = resMap[fechaISO];
  if(estado==='reservado' || estado==='cedido'){
    if(!confirm(`¿Liberar el ${fechaISO} (estado: ${estado})?`)) return;
    const { error } = await sb.from('reservas').delete().eq('activo_id',activoId).eq('fecha',fechaISO);
    if(error){ alert('No se pudo: '+error.message); return; }
    delete resMap[fechaISO]; redraw(); return;
  }
  const op = prompt(`Día ${fechaISO}. Escribe "reservar" (gastas ${cd.es_weekend?'1.68':'1.00'} pts) o "ceder" (al operador para rentar).`);
  if(!op) return;
  const modo = op.toLowerCase().startsWith('c') ? 'cedido' : 'reservado';
  const pts = modo==='reservado' ? (cd.es_weekend?1.68:1.00) : 0;
  const { error } = await sb.from('reservas').insert({ activo_id:activoId, fecha:fechaISO, co_propietario_id:uid, estado:modo, puntos_gastados:pts });
  if(error){ alert('No se pudo: '+error.message); return; }
  resMap[fechaISO]=modo; redraw();
}

// ————— ADMIN —————
async function panelAdmin(){
  H(`<h1>Administración</h1><p class="lead">Activos, fracciones, usuarios y pipeline comercial.</p><div id="c"><div class="empty">Cargando…</div></div>`);
  const [act,fr,per,sol,cot] = await Promise.all([
    sb.from('activos').select('*'), sb.from('fracciones').select('*,activo:activos(nombre)'),
    sb.from('perfiles').select('*'), sb.from('solicitudes').select('*').order('creada_en',{ascending:false}),
    sb.from('cotizaciones').select('*').order('creada_en',{ascending:false})
  ]);
  const A=act.data||[],F=fr.data||[],P=per.data||[],S=sol.data||[],C=cot.data||[];
  let h = `<div class="stats">${stat('Activos',A.length)}${stat('Fracciones',F.length)}${stat('Usuarios',P.length)}${stat('Leads',S.length)}</div>`;
  h += `<div class="eyebrow">Activos</div>` + tbl(['Nombre','Vertical','Destino','Valor','Estado'],
    A.map(a=>`<tr><td>${a.nombre}</td><td>${cap(a.vertical)}</td><td>${a.destino||'—'}</td><td>${COP(a.valor_total)}</td><td><span class="pill gold">${cap(a.estado)}</span></td></tr>`).join(''));
  h += `<div class="eyebrow">Fracciones</div>` + tbl(['Activo','Slot','Tipo','%','Precio','Estado'],
    F.map(f=>`<tr><td>${f.activo?.nombre||'—'}</td><td>${f.slot}</td><td>${cap(f.tipo)}</td><td>${(f.pct*100).toFixed(2)}%</td><td>${COP(f.precio)}</td><td><span class="pill ${f.estado==='vendida'?'ok':''}">${cap(f.estado)}</span></td></tr>`).join(''));
  h += `<div class="eyebrow">Usuarios</div>` + tbl(['Nombre','Correo','Rol','KYC'],
    P.map(p=>`<tr><td>${p.nombre}</td><td>${p.email}</td><td><span class="pill gold">${ROL_LABEL[p.rol]||p.rol}</span></td><td>${cap(p.kyc_estado)}</td></tr>`).join(''));
  h += `<div class="eyebrow">Solicitudes</div>` + tbl(['Nombre','Producto','Perfil','Estado'],
    S.map(s=>`<tr><td>${s.nombre}</td><td>${cap(s.producto||'—')}</td><td>${cap(s.perfil||'—')}</td><td><span class="pill">${cap(s.estado)}</span></td></tr>`).join(''));
  $('c').innerHTML = h;
}

// ————— OPERADOR —————
async function panelOperador(){
  H(`<h1>Operación</h1><p class="lead">Los activos que operas, los días cedidos y las rentas.</p><div id="c"><div class="empty">Cargando…</div></div>`);
  const { data:act } = await sb.from('activos').select('*').eq('operador_id',ME.id);
  const { data:rentas } = await sb.from('rentas').select('*,activo:activos(nombre)').order('fecha');
  const { data:cedidos } = await sb.from('reservas').select('*,activo:activos(nombre)').eq('estado','cedido');
  const ingresoOp=(rentas||[]).reduce((a,r)=>a+Number(r.comision_operador),0);
  let h=`<div class="stats">${stat('Activos operados',(act||[]).length)}${stat('Días cedidos',(cedidos||[]).length)}${stat('Rentas',(rentas||[]).length)}${stat('Comisión','<small>'+COP(ingresoOp)+'</small>')}</div>`;
  h+=`<div class="eyebrow">Activos que operas</div>`+tbl(['Nombre','Vertical','Destino','Estado'],
    (act||[]).map(a=>`<tr><td>${a.nombre}</td><td>${cap(a.vertical)}</td><td>${a.destino||'—'}</td><td><span class="pill gold">${cap(a.estado)}</span></td></tr>`).join(''));
  h+=`<div class="eyebrow">Días cedidos para rentar</div>`+tbl(['Activo','Fecha','Estado'],
    (cedidos||[]).map(c=>`<tr><td>${c.activo?.nombre||'—'}</td><td>${fecha(c.fecha)}</td><td><span class="pill warn">Cedido</span></td></tr>`).join(''));
  h+=`<div class="eyebrow">Rentas</div>`+tbl(['Activo','Fecha','Huésped','Renta','Comisión','Estado'],
    (rentas||[]).map(r=>`<tr><td>${r.activo?.nombre||'—'}</td><td>${fecha(r.fecha)}</td><td>${r.huesped_nombre||'—'}</td><td>${COP(r.monto)}</td><td>${COP(r.comision_operador)}</td><td><span class="pill ok">${cap(r.estado)}</span></td></tr>`).join(''));
  $('c').innerHTML=h;
}

// ————— ASESOR —————
async function panelAsesor(){
  H(`<h1>Comercial</h1><p class="lead">Leads y cotizaciones para dar seguimiento.</p><div id="c"><div class="empty">Cargando…</div></div>`);
  const { data:sol } = await sb.from('solicitudes').select('*').order('creada_en',{ascending:false});
  const { data:cot } = await sb.from('cotizaciones').select('*').order('creada_en',{ascending:false});
  const nuevas=(sol||[]).filter(s=>s.estado==='nueva').length;
  let h=`<div class="stats">${stat('Leads',(sol||[]).length)}${stat('Nuevos',nuevas)}${stat('Cotizaciones',(cot||[]).length)}${stat('Convertidos',(sol||[]).filter(s=>s.estado==='convertida').length)}</div>`;
  h+=`<div class="eyebrow">Solicitudes</div>`+tbl(['Nombre','Contacto','Producto','Perfil','Origen','Estado'],
    (sol||[]).map(s=>`<tr><td>${s.nombre}</td><td>${[s.email,s.telefono].filter(Boolean).join('<br>')||'—'}</td><td>${cap(s.producto||'—')}</td><td>${cap(s.perfil||'—')}</td><td>${s.origen||'—'}</td><td><span class="pill">${cap(s.estado)}</span></td></tr>`).join(''));
  h+=`<div class="eyebrow">Cotizaciones</div>`+tbl(['Tipo','Nombre','Contacto','Fecha'],
    (cot||[]).map(c=>`<tr><td>${cap(c.tipo)}</td><td>${c.nombre||'—'}</td><td>${c.email||'—'}</td><td>${new Date(c.creada_en).toLocaleDateString('es-CO')}</td></tr>`).join(''));
  $('c').innerHTML=h;
}

// ————— DUEÑO (ORIGEN) —————
async function panelDueno(){
  H(`<h1>Mi propiedad en Origen</h1><p class="lead">El estado de la propiedad que incorporaste y tu fracción conservada.</p><div id="c"><div class="empty">Cargando…</div></div>`);
  const { data:act } = await sb.from('activos').select('*').eq('dueno_id',ME.id);
  const ids=(act||[]).map(a=>a.id);
  let fr=[]; if(ids.length){ const {data}=await sb.from('fracciones').select('*,activo:activos(nombre)').in('activo_id',ids); fr=data||[]; }
  const vendidas=fr.filter(f=>f.estado==='vendida').length;
  let h=`<div class="stats">${stat('Propiedades',(act||[]).length)}${stat('Fracciones',fr.length)}${stat('Vendidas',vendidas)}${stat('Disponibles',fr.length-vendidas)}</div>`;
  h+=`<div class="eyebrow">Mis propiedades incorporadas</div>`+tbl(['Nombre','Destino','Valor','Remodelación','Estado'],
    (act||[]).map(a=>`<tr><td>${a.nombre}</td><td>${a.destino||'—'}</td><td>${COP(a.valor_total)}</td><td>${COP(a.remodelacion)}</td><td><span class="pill gold">${cap(a.estado)}</span></td></tr>`).join(''));
  h+=`<div class="eyebrow">Curva de desapego (fracciones)</div>`+tbl(['Slot','Tipo','%','Precio','Estado'],
    fr.map(f=>`<tr><td>${f.slot}</td><td>${cap(f.tipo)}</td><td>${(f.pct*100).toFixed(2)}%</td><td>${COP(f.precio)}</td><td><span class="pill ${f.estado==='vendida'?'ok':''}">${cap(f.estado)}</span></td></tr>`).join(''));
  if(!act||!act.length) h+=`<div class="banner">Aún no tienes una propiedad incorporada. Empieza por el cotizador de Origen.</div>`;
  $('c').innerHTML=h;
}

// ————— HUÉSPED —————
async function panelHuesped(){
  H(`<h1>Estadías</h1><p class="lead">Explora destinos Fractal disponibles para reservar una estadía.</p><div id="c"><div class="empty">Cargando…</div></div>`);
  const { data:act } = await sb.from('activos').select('*').in('estado',['disponible','operando']);
  let h=`<div class="grid">`;
  (act||[]).forEach(a=>{ h+=`<div class="tile"><h3>${a.nombre}</h3>
    <div class="rowl"><span class="s">Destino</span><span>${a.destino||'—'}</span></div>
    <div class="rowl"><span class="s">Tipo</span><span>${cap(a.vertical)}</span></div>
    <div style="margin-top:12px"><button class="btn sm primary" onclick="alert('Solicitud de estadía enviada (demo).')">Consultar disponibilidad</button></div></div>`; });
  h+=`</div>`;
  if(!act||!act.length) h+=`<div class="empty">No hay destinos disponibles por ahora.</div>`;
  $('c').innerHTML=h;
}
</script>
</body>
</html>
